name: Formatting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Format_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check formatting
        run: |
          OXFMT_VERSION=$(sed -n 's/.*"oxfmt": \["oxfmt@\([^"]*\)".*/\1/p' bun.lock)
          OXFMT="npx --yes oxfmt@${OXFMT_VERSION}"
          $OXFMT --check || \
          ($OXFMT \
          && git --no-pager diff \
          && exit 1)

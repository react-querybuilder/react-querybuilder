name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "utils/**"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "utils/**"
      - "package.json"
      - "bun.lock"

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # with:
        #   bun-version: 1.1.29
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: |
          mkdir -p ${{ github.workspace }}/packs
          for dir in $(ls packages); do
            (cd packages/$dir && bun pm pack --destination ${{ github.workspace }}/packs)
          done
      - parallel:
          - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            with:
              name: packs
              path: packs/*.tgz
          - name: Publish to pkg.pr.new
            run: bunx pkg-pr-new publish './packages/*' --template './examples/!(_template|native|native-expo)' --packageManager=bun --bun

  Typecheck_and_lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Seed website/api/typedoc-sidebar.cjs
        run: |
          echo '// @ts-check
          /** @type {import("@docusaurus/plugin-content-docs").SidebarsConfig} */
          const typedocSidebar = { items: [] };
          module.exports = typedocSidebar.items;' \
          > ./website/api/typedoc-sidebar.cjs
      - parallel:
          - run: bun run typecheck
          - run: bun run lint --format=github
          - run: bun run are-the-types-wrong
          - run: bun run check-dts-peer-leaks
          - run: bun run skills:check

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # with:
        #   bun-version: 1.1.29
      # JDK 17 for the real-Spring SpEL dbquery suite (Spring 6.1 requires Java 17).
      # Java setup + jar cache only needed by `test`; run in background during install/build.
      - id: setup-java
        background: true
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      # Cache the Maven-fetched jars (see verifySpELEvaluator.ts). Key is pinned to the hard-coded
      # Spring/Jackson versions so a version bump forces a fresh download.
      - id: spel-cache
        background: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: utils/spel-evaluator/lib
          key: spel-jars-spring6.1.14-jackson2.17.2
      - run: bun install --frozen-lockfile
      - parallel:
          - run: bun run build:core
          - run: bun run generate-prisma-client
      - wait: [setup-java, spel-cache]
      - parallel:
          - run: bun run check-derivations-purity
          - run: bun run test:bun
          - run: bun run test:coverage
          - run: bun run conformance:check
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Runs `formatQuery` output (core, datetime, expr) against real SQL Server, Oracle, MySQL and
  # MariaDB. The `dbquery.*{mssql,oracle,mysql}*` files self-skip elsewhere (no connection env vars).
  # Image bump: pick the newest `2022-CUxx-ubuntu-22.04` tag from
  # https://mcr.microsoft.com/v2/mssql/server/tags/list and the newest `23.x.y-slim-faststart` tag
  # from https://hub.docker.com/r/gvenzl/oracle-free/tags; newest `8.4.x` (LTS) / `11.4.x` (LTS)
  # tags from https://hub.docker.com/_/mysql / https://hub.docker.com/_/mariadb; never use floating
  # tags.
  # Passwords are throwaway values for ephemeral containers (no secrets -> fork PRs work).
  DBIntegration:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Rqb_Test_1234!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Rqb_Test_1234!' -Q 'SELECT 1'"
          --health-interval 10s --health-retries 12
      oracle:
        image: gvenzl/oracle-free:23.26.3-slim-faststart
        env:
          ORACLE_PASSWORD: rqb_sys
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s --health-retries 30
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: rqb_root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prqb_root"
          --health-interval 5s --health-retries 30
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: rqb_root
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-retries 30
    env:
      RQB_MSSQL_URL: mssql://sa:Rqb_Test_1234!@localhost:1433
      RQB_ORACLE_ADMIN_URL: oracle://system:rqb_sys@localhost:1521/FREEPDB1
      # Low-privilege app user, created by the harness on first use
      RQB_ORACLE_URL: oracle://rqb_app:rqb_app@localhost:1521/FREEPDB1
      RQB_MYSQL_URL: mysql://root:rqb_root@127.0.0.1:3306
      RQB_MARIADB_URL: mysql://root:rqb_root@127.0.0.1:3307
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build:core
      - run: bun run test:dbintegration

  DBIntegrationVector:
    runs-on: ubuntu-latest
    services:
      qdrant:
        # Image has no curl/wget; readiness polled from the runner below
        image: qdrant/qdrant:v1.15.4
        ports: ["6333:6333"]
      chroma:
        image: chromadb/chroma:1.5.9
        ports: ["8000:8000"]
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.40.1
        ports: ["8080:8080"]
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          DEFAULT_VECTORIZER_MODULE: none
          CLUSTER_HOSTNAME: node1
    env:
      RQB_QDRANT_URL: http://localhost:6333
      RQB_CHROMA_URL: http://localhost:8000
      RQB_WEAVIATE_URL: http://localhost:8080
      RQB_MILVUS_URL: http://localhost:19530
      # Pinecone: opt-in only (real account; Pinecone Local is EOL) — RQB_PINECONE_URL/_API_KEY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build:core
      # Services can't set the start command; standalone w/ embedded etcd + local storage
      - name: Start Milvus
        run: |
          printf 'listen-client-urls: http://0.0.0.0:2379\nadvertise-client-urls: http://0.0.0.0:2379\nquota-backend-bytes: 4294967296\nauto-compaction-mode: revision\nauto-compaction-retention: "1000"\n' > "$RUNNER_TEMP/embedEtcd.yaml"
          docker run -d --name milvus --security-opt seccomp:unconfined \
            -e ETCD_USE_EMBED=true -e ETCD_DATA_DIR=/var/lib/milvus/etcd \
            -e ETCD_CONFIG_PATH=/milvus/configs/embedEtcd.yaml -e COMMON_STORAGETYPE=local \
            -e DEPLOY_MODE=STANDALONE \
            -v "$RUNNER_TEMP/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro" \
            -p 19530:19530 -p 9091:9091 \
            milvusdb/milvus:v3.0.3 milvus run standalone
      - name: Wait for vector DBs
        run: |
          timeout 60 bash -c 'until curl -sf "$RQB_QDRANT_URL/readyz"; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf "$RQB_CHROMA_URL/api/v2/heartbeat"; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf "$RQB_WEAVIATE_URL/v1/.well-known/ready"; do sleep 2; done'
          timeout 180 bash -c 'until curl -sf http://localhost:9091/healthz; do sleep 3; done' || { docker logs milvus; exit 1; }
      - run: bun run test:dbintegration:vector

  Test_React_18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        # with:
        #   bun-version: 1.1.29
      - name: Install React 18 and Run Tests
        run: |
          # Set all catalog React dependencies to v18
          sed -i -E 's/("(@types\/)?react(-dom|-test-renderer)?": ")\^?19.*"/\1^18"/g' ./package.json

          # Mantine 9 does not support React 18, so test with Mantine 8
          sed -i -E 's/("@mantine\/[a-z-]+"): ".*"/\1: "^8"/g' ./packages/mantine/package.json
          # Minor tweak for Mantine 8
          sed -i -E "s/screen\.getByRole\('combobox'\)/screen.getByRole('textbox')/g" ./packages/mantine/src/Mantine.test.tsx

          # RNTL 14 does not support React 18, and the rules-engine package has a React 18
          # infinite-loop issue, so exclude both packages from the Vitest projects
          sed -i "s|Object.entries(projects)|Object.entries(projects).filter(([dir]) => dir !== 'native' \&\& dir !== 'rules-engine')|" ./vitest.config.mts

          bun install

          bun run build:core

          bunx vitest run --coverage=false

  Typecheck_React_18:
    name: Typecheck React 18
    needs: [Build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packs
          path: packs
          merge-multiple: true
      - name: Typecheck with React 18
        run: |
          FAILED=()
          for dir in $(find examples -mindepth 1 -maxdepth 1 -type d); do
            if [ "$dir" != "examples/_template" ] \
            && [ "$dir" != "examples/basic" ] \
            && [ "$dir" != "examples/next" ]; then
              cd $dir
              echo "::group::Typechecking $dir with React 18"

              # Get list of all RQB dependencies in this example
              RQB_DEPS=$(grep -oE '"@?react-querybuilder(\/\w+)?": ' ./package.json \
                | sed -E 's/^"@?//; s/": $//; s/\//-/' \
                | tr '\n' '|' \
                | sed -E 's/\|+$//')
              ALL_PACKS=$(ls ../../packs)
              FILTERED_PACKS=$(echo "$ALL_PACKS" \
                | grep -E "($RQB_DEPS)-[0-9]+\.[0-9]+\.[0-9]+.*\.tgz")
              RQB_DEP_PACKS=$(echo "$FILTERED_PACKS" | sort -k1,1 -n | awk '{print "../../packs/" $0}')

              # Set all React dependencies to v18
              sed -i -E 's/("(@types\/)?react(-dom)?": ")\^?19.*"/\1^18"/g' ./package.json

              # Mantine 9 does not support React 18, so typecheck with Mantine 8
              sed -i -E 's/("@mantine\/[a-z-]+"): ".*"/\1: "^8"/g' ./package.json

              # Remove all RQB version-based dependencies
              sed -i -E '/"@?react-querybuilder(\/\w+)?":/d' ./package.json

              # Install remaining non-RQB dependencies
              bun install

              # Add back all RQB packages from the packs directory
              # (`-n 1` to add them one at a time, otherwise we get DependencyLoop errors)
              echo "$RQB_DEP_PACKS" | xargs -n 1 bun add

              # Force @react-querybuilder/core to resolve to the local pack. Otherwise
              # `react-querybuilder` (which depends on `^X.Y.Z`) pulls a nested copy from
              # the registry, and unreleased core type changes are lost. The override applies
              # even when core is only a transitive dependency, so source it from the packs dir.
              CORE_PACK=$(ls ../../packs \
                | grep -E 'react-querybuilder-core-[0-9]' | head -n 1)
              [ -n "$CORE_PACK" ] && CORE_PACK="../../packs/$CORE_PACK"
              if [ -n "$CORE_PACK" ]; then
                CORE_PACK="$CORE_PACK" bun -e '
                  const p = await Bun.file("package.json").json();
                  p.overrides = p.overrides || {};
                  p.overrides["@react-querybuilder/core"] = process.env.CORE_PACK;
                  await Bun.write("package.json", JSON.stringify(p, null, 2) + "\n");
                '
                # Clean reinstall so the override applies (a re-`bun add` would re-nest core)
                rm -rf node_modules bun.lock bun.lockb
                bun install
              fi

              # Typecheck
              bunx tsc --noEmit || FAILED+=("$dir")

              echo "::endgroup::"
              cd ../..
            else
              echo "SKIPPING $dir"
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            printf "::error::React 18 typecheck failed: %s\n" "${FAILED[*]}"
            exit 1
          fi
